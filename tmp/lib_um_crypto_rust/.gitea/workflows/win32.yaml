name: Build (win32)
on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-pc-windows-gnu
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-win32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-win32-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ env.TARGET }}
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build (win32 release)
        run: |
          cargo build --release --target ${{ env.TARGET }} -p um_cli
          mkdir -p dist
          mv target/${{ env.TARGET }}/release/um_cli_rs.exe dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: um_cli-win32
          path: dist/*
      - name: Create Release Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p release/
          cd dist
          python3 -m zipfile -c "../release/um_cli_rs-win32-${VERSION}.zip" um_cli_rs.exe
      - name: Create Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: akkuman/gitea-release-action@v1
        with:
          draft: true
          files: |
            release/um_cli_rs-win32-*.zip
          body: |
            上个版本：[v0.0.0](https://git.um-react.app/um/lib_um_crypto_rust/releases/tag/v0.0.0)

            ## 🐛 修正

            - 修正内容

            ## ✨ 新增

            - 新增内容

            ## 🔧 维护

            - 维护内容

