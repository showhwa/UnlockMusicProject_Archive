# Debian and Arch use the same executable names.
[constants]
toolchain_bin = '/usr/bin'


[binaries]
c = toolchain_bin / 'x86_64-w64-mingw32-gcc'
ar = toolchain_bin / 'x86_64-w64-mingw32-ar'
strip = toolchain_bin / 'x86_64-w64-mingw32-strip'
windres = toolchain_bin / 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
